name: OpenField publishing checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify syntax
        run: |
          node --check app.js
          node --check data.js
          node --check server.mjs
          node --check scripts/expire-listings.mjs
      - name: Verify actual listings and SEO files
        run: node scripts/verify-site.mjs
