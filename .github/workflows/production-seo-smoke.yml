name: Production SEO smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify live production HTTP and SEO
        run: node scripts/check-live-seo.mjs
