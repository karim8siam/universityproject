name: OpenField automatic deadline expiry
on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/expire-listings.mjs
      - run: node scripts/verify-site.mjs
      - name: Commit changed archive status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Archive expired university opportunity pages and update sitemap"
            git push
          fi
